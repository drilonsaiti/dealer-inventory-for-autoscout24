name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: Coding standards (WPCS, PHP 8.1+ compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer audit --no-interaction
      - run: vendor/bin/phpcs

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
        wp: [ 'latest' ]
        include:
          - php: '8.1'
            wp: '6.5'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports: [ '3306:3306' ]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, intl
          tools: composer:v2, wp-cli
          coverage: none
      - name: Install dependencies
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then WP_PHPUNIT="*"; else WP_PHPUNIT="${{ matrix.wp }}.*"; fi
          composer require --dev --no-interaction --no-progress --no-update "wp-phpunit/wp-phpunit:${WP_PHPUNIT}"
          # WordPress before 6.6 expects PHPUnit Polyfills 1.x.
          if [ "${{ matrix.wp }}" != "latest" ]; then composer require --dev --no-interaction --no-progress --no-update "yoast/phpunit-polyfills:^1.1"; fi
          composer update --no-interaction --no-progress --prefer-dist
      - name: Download WordPress
        run: wp core download --version=${{ matrix.wp }} --path=/tmp/wordpress --skip-content --allow-root
      - name: Test configuration
        run: |
          cat > /tmp/wp-tests-config.php <<'PHP'
          <?php
          define( 'ABSPATH', '/tmp/wordpress/' );
          define( 'WP_DEFAULT_THEME', 'default' );
          define( 'WP_DEBUG', true );
          define( 'DB_NAME', 'wordpress_tests' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'DB_COLLATE', '' );
          $table_prefix = 'wptests_';
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          define( 'WP_PHP_BINARY', 'php' );
          PHP
      - name: Run tests
        env:
          WP_PHPUNIT__TESTS_CONFIG: /tmp/wp-tests-config.php
        run: vendor/bin/phpunit

  js:
    name: JavaScript smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:js

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin folder
        run: |
          mkdir -p build/dealer-inventory-for-autoscout24
          rsync -a --exclude-from=.distignore ./ build/dealer-inventory-for-autoscout24/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/dealer-inventory-for-autoscout24
          slug: dealer-inventory-for-autoscout24
